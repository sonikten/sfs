name: ci

# 4-platform matrix per the SFS Phase 0 plan (docs/phase-plans/phase-0.md §8).
# At Phase 0 step 3 this workflow does only `cmake -B build && cmake --build build`
# — there are no targets yet. Tests, lint, format check, and pluginval gates
# turn on in later Phase 0 steps and are added below as separate jobs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs when a new commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel macOS (macos-13) was dropped from v1.0 — Apple Silicon only on
          # macOS. Cross-architecture bit-exact reproducibility is still verified
          # via Linux + Windows (x86_64) vs. macOS (arm64).
          - os: macos-14       # Apple Silicon
            arch: arm64
          - os: windows-2022
            arch: x86_64
          - os: ubuntu-22.04
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux audio + GUI dev packages
        if: runner.os == 'Linux'
        # Pinned set per phase-0.md §5: even though Phase 0 plug-in is GUI-less,
        # we install the JUCE deps now so a missing package is caught at the
        # Phase 0 boundary, not when JUCE actually arrives.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev \
            mesa-common-dev

      - name: Fetch tags inside submodules (checkout is shallow)
        shell: bash
        run: git submodule foreach --recursive 'git fetch --tags --quiet origin || true'

      - name: Verify submodule pins
        shell: bash
        run: tools/check_submodule_pins.sh

      - name: Determinism check (forbidden symbols)
        shell: bash
        run: tools/check_determinism.sh

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSFS_BUILD_PLUGIN=ON -DSFS_BUILD_TOOLS=ON -DSFS_BUILD_TESTS=ON

      - name: Build (top-level)
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        working-directory: build
        run: ctest --output-on-failure --build-config Release

      # ---------------------------------------------------------------------
      # The following jobs/steps turn on in later Phase 0 steps. Listed here
      # as commented placeholders so the order is visible and so the next
      # session knows what to add when.
      # ---------------------------------------------------------------------
      # P0.4: nothing extra — submodules are cloned via `submodules: recursive` above.
      # P0.6: build sfs_plugin target (added below).
      # P0.7: build sfs_render tool target.
      # P0.8: see .github/workflows/determinism.yml — runs sfs_render on each
      #       platform, uploads the WAV + sha256, then compares across platforms.
      # P0.9: see .github/workflows/pluginval.yml — pluginval Level 1.

      - name: Build VST3 + render rig
        run: cmake --build build --target sfs_plugin_VST3 sfs_render --config Release --parallel

  format:
    name: clang-format check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-15
          sudo ln -sf /usr/bin/clang-format-15 /usr/local/bin/clang-format

      - name: Verify formatting on first-party C/C++
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find src tools tests -type f \( \
              -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \
              -o -name '*.cxx' -o -name '*.hxx' -o -name '*.cc' -o -name '*.c' \) \
              2>/dev/null)
          if [ "${#files[@]}" -eq 0 ]; then
              echo "No first-party source files found yet; skipping."
              exit 0
          fi
          echo "Checking ${#files[@]} files..."
          clang-format --dry-run --Werror --style=file "${files[@]}"
