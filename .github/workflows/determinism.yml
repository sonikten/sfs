name: determinism

# Cross-platform bit-exact reproducibility gate (Phase 0 step 8 + plan §4.3).
#
# Each platform builds sfs_render, renders the canonical reference clip, and
# uploads the WAV + SHA-256 as an artifact. A final `compare` job downloads
# all four artifacts and asserts every hash matches. A mismatch fails the
# build with the offending platform's WAV attached for diagnosis.
#
# This is the single hardest CI gate in the project: every commit must
# preserve bit-exactness across macOS x64, macOS arm64, Windows x64, Linux x64.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: render (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel macOS dropped from v1.0 — Apple Silicon only on macOS.
          - os: macos-14
            slug: macos-arm64
          - os: windows-2022
            slug: windows-x86_64
          - os: ubuntu-22.04
            slug: linux-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux audio + GUI dev packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - name: Fetch tags inside submodules (checkout is shallow)
        shell: bash
        run: git submodule foreach --recursive 'git fetch --tags --quiet origin || true'

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSFS_BUILD_PLUGIN=ON -DSFS_BUILD_TOOLS=ON -DSFS_BUILD_TESTS=OFF

      - name: Build sfs_render + sfs_render_presets
        run: cmake --build build --target sfs_render sfs_render_presets --config Release --parallel

      - name: Render canonical reference clip
        shell: bash
        run: tools/render_reference.sh build/ref_renders

      - name: Render all preset WAVs (default/drone/pitched/organic/glitch + 6 extreme)
        shell: bash
        run: |
          mkdir -p build/preset_renders
          # Locate the binary (Release suffix on Windows).
          for cand in \
              build/bin/sfs_render_presets \
              build/bin/Release/sfs_render_presets \
              build/bin/sfs_render_presets.exe \
              build/bin/Release/sfs_render_presets.exe; do
              if [ -x "$cand" ]; then
                  "$cand" build/preset_renders
                  break
              fi
          done

      - name: Hash canonical PCM frames (determinism contract surface)
        shell: bash
        run: tools/hash_pcm.sh build/ref_renders/*.raw | tee build/ref_renders/hashes.txt

      - name: Hash preset PCM frames (extended cross-platform check)
        shell: bash
        run: tools/hash_pcm.sh build/preset_renders/*.raw | tee build/preset_renders/hashes.txt

      - name: Upload canonical artifact
        uses: actions/upload-artifact@v7
        with:
          name: render-${{ matrix.slug }}
          path: |
            build/ref_renders/*.raw
            build/ref_renders/*.wav
            build/ref_renders/hashes.txt
          retention-days: 14

      - name: Upload preset artifact (auditionable CI builds)
        uses: actions/upload-artifact@v7
        with:
          name: presets-${{ matrix.slug }}
          path: |
            build/preset_renders/*.wav
            build/preset_renders/*.raw
            build/preset_renders/hashes.txt
            build/preset_renders/report.txt
          retention-days: 14

  compare:
    name: cross-platform hash compare
    needs: render
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Compare hashes across all 4 platforms
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Per-platform hashes ==="
          for d in artifacts/render-*/; do
              echo "--- $d ---"
              cat "$d/hashes.txt"
          done

          # Extract just the 64-char hex hashes from each platform.
          # Sort, uniq -c — we expect exactly one unique hash per filename.
          mapfile -t platforms < <(ls -d artifacts/render-*/ | sort)
          if [ "${#platforms[@]}" -ne 3 ]; then
              echo "ERROR: expected 3 platform artifacts (macos-arm64, windows-x86_64, linux-x86_64), got ${#platforms[@]}." >&2
              exit 1
          fi

          # Build a per-file matrix: for each WAV name, gather one hash per platform.
          mapfile -t wav_names < <(awk '{print $2}' "${platforms[0]}hashes.txt" | xargs -n1 basename | sort -u)
          fail=0
          for wav in "${wav_names[@]}"; do
              echo
              echo "=== ${wav} ==="
              hashes=()
              for p in "${platforms[@]}"; do
                  h=$(grep " .*${wav}\$" "${p}hashes.txt" | awk '{print $1}')
                  plat=$(basename "${p%/}")
                  echo "  ${plat}: ${h}"
                  hashes+=("${h}")
              done
              uniq=$(printf "%s\n" "${hashes[@]}" | sort -u | wc -l | tr -d ' ')
              if [ "${uniq}" = "1" ]; then
                  echo "  → MATCH"
              else
                  echo "  → DRIFT (${uniq} distinct hashes across platforms)"
                  fail=1
              fi
          done

          if [ "$fail" = "1" ]; then
              echo
              echo "Determinism contract violated. Inspect uploaded WAV artifacts to bisect."
              echo "Use tools/wav_diff (Phase 0 step 8 follow-up) to find the first divergent sample."
              exit 1
          fi

          echo
          echo "All ${#wav_names[@]} reference clip(s) hash-match across all 3 platforms."

          # Extended cross-platform check: 11 preset PCM hashes.
          echo
          echo "=== Preset render cross-platform hashes ==="
          mapfile -t preset_platforms < <(ls -d artifacts/presets-*/ | sort)
          if [ "${#preset_platforms[@]}" -ne 3 ]; then
              echo "ERROR: expected 3 preset platform artifacts, got ${#preset_platforms[@]}." >&2
              exit 1
          fi
          mapfile -t preset_names < <(awk '{print $2}' "${preset_platforms[0]}hashes.txt" | xargs -n1 basename | sort -u)
          preset_fail=0
          for w in "${preset_names[@]}"; do
              echo
              echo "=== ${w} ==="
              hashes=()
              for p in "${preset_platforms[@]}"; do
                  h=$(grep " .*${w}\$" "${p}hashes.txt" | awk '{print $1}')
                  plat=$(basename "${p%/}")
                  echo "  ${plat}: ${h}"
                  hashes+=("${h}")
              done
              uniq=$(printf "%s\n" "${hashes[@]}" | sort -u | wc -l | tr -d ' ')
              if [ "${uniq}" = "1" ]; then
                  echo "  → MATCH"
              else
                  echo "  → DRIFT"
                  preset_fail=1
              fi
          done

          if [ "$preset_fail" = "1" ]; then
              echo
              echo "Preset cross-platform hash drift. Inspect presets-* artifacts to bisect."
              exit 1
          fi
          echo
          echo "All ${#preset_names[@]} preset clip(s) hash-match across all 3 platforms."
